<header class="site-header">
  <div class="nav-container">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <button class="nav-toggle" aria-label="toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links-wrapper">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url contains 'about' %} class="active"{% endif %}>About</a></li>
        <li><a href="{{ '/tags/' | relative_url }}"{% if page.url contains 'tags' %} class="active"{% endif %}>Tags</a></li>
        <li><a href="{{ '/cheatsheets/' | relative_url }}"{% if page.url contains 'cheatsheets' %} class="active"{% endif %}>Cheatsheets</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}" title="RSS Feed">RSS</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
  // Mobile nav toggle
  document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.nav-links-wrapper');
    if (toggle && nav) {
      toggle.addEventListener('click', function() {
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', !expanded);
        nav.classList.toggle('open');
      });
    }
  });
</script>
