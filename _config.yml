title: 0xzknight hacks stuff
description: CTF write-ups, пентест, red team заметки
url: "https://0xzknight.github.io"
baseurl: ""
author: 0xzknight
email: ""

# Кастомная тема — без remote_theme
# Все layouts и includes в проекте

permalink: /posts/:year/:month/:day/:title/

# Коллекции
collections:
  cheatsheets:
    output: true
    permalink: /cheatsheets/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: cheatsheets
    values:
      layout: cheatsheet

# Плагины (работают через GitHub Actions, не ограничены safe mode)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-seo-tag

# Автогенерация страниц тегов
jekyll-archives:
  enabled:
    - tags
  layout: tag
  permalinks:
    tag: /tags/:name/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    block:
      line_numbers: false

# Исключения
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - "*.zip"
