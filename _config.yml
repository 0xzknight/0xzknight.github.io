title: zknight
tagline: "HTB writeups · pentest notes · cheatsheets"
description: "Security research blog — HackTheBox writeups, cheatsheets, and pentest notes."
url: "https://0xzknight.github.io"
baseurl: ""

github:
  username: 0xzknight

social:
  name: zknight
  email: ""
  links:
    - https://github.com/0xzknight

lang: en
timezone: Asia/Dushanbe

theme: jekyll-theme-chirpy
theme_mode: dark

avatar: ""
toc: true

comments:
  active: ""

paginate: 15
permalink: /posts/:year/:month/:day/:title/

collections:
  cheatsheets:
    output: true
    permalink: /cheatsheets/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      comments: false
  - scope:
      path: ""
      type: cheatsheets
    values:
      layout: cheatsheet
      toc: true

jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: category
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
